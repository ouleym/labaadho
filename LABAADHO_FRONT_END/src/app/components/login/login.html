<div class="login-container d-flex justify-content-center align-items-center">
  <div class="login-box shadow-sm p-5 bg-white rounded-4 text-center">
    <h2 class="fw-bold mb-4 text-uppercase">LABAADHO</h2>

    <!-- ✅ Titre dynamique -->
    <h4 class="fw-semibold mb-2">
      {{ isAdminLogin ? 'Connexion Administrateur' : 'Se connecter' }}
    </h4>
    <p class="text-muted mb-4">
      {{ isAdminLogin ? 'Connectez-vous à votre espace admin' : 'Connectez-vous à votre compte' }}
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3 text-start">
        <label for="email" class="form-label fw-medium">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          class="form-control rounded-3 py-2"
          formControlName="email"
          placeholder="Entrez votre e-mail"
        />
      </div>

      <div class="mb-4 text-start">
        <label for="password" class="form-label fw-medium">Mot de passe</label>
        <input
          type="password"
          id="password"
          class="form-control rounded-3 py-2"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
        />
      </div>

      <!-- ✅ Message d'erreur -->
      <div *ngIf="errorMessage" class="alert alert-danger py-2">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-dark w-100 py-2 rounded-3 fw-semibold"
        [disabled]="loginForm.invalid || isLoading">
        {{ isAdminLogin ? 'Se connecter (Admin)' : 'Se connecter' }}
      </button>
    </form>

    <!-- ✅ Bouton de bascule admin/client -->
    <div class="mt-3">
      <button type="button" class="btn btn-link text-decoration-none fw-medium text-dark"
              (click)="toggleRole()">
        {{ isAdminLogin ? '⇠ Passer au mode client' : '⇢ Connexion administrateur' }}
      </button>
    </div>

    <p class="mt-3 text-muted" *ngIf="!isAdminLogin">
      Vous n’avez pas de compte ?
      <a routerLink="/register" class="text-decoration-none fw-medium text-black">Créer un compte</a>
    </p>
  </div>
</div>
