<div class="admin-clients">
  <h1>Gestion Clients</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Date d’inscription</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clients">
        <td>{{ c.id }}</td>
        <td>{{ c.nom }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.telephone }}</td>
        <td>{{ c.dateInscription }}</td>
        <td>
          <button (click)="supprimerClient(c.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
